<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Multi-Broker Arbitrage{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        :root {
            --bs-body-bg: #ffffff;
            --bs-body-color: #1a1a1a;
            --card-bg: #f8f9fa;
            --card-border: #dee2e6;
            --accent-color: #1a1a1a;
            --positive-color: #00c853;
            --negative-color: #ff1744;
            --neutral-color: #6c757d;
            --muted-color: #adb5bd;
        }

        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .navbar {
            background-color: var(--bs-body-color) !important;
            border-bottom: 1px solid var(--card-border);
        }

        .navbar-brand {
            font-weight: 600;
            color: #ffffff !important;
        }

        .nav-link {
            color: rgba(255,255,255,0.7) !important;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
        }

        .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--card-border);
            font-weight: 600;
            color: var(--bs-body-color);
        }

        .stat-card {
            text-align: center;
            padding: 1.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--neutral-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .positive { color: var(--positive-color) !important; }
        .negative { color: var(--negative-color) !important; }
        .neutral { color: var(--neutral-color) !important; }

        .btn-primary {
            background-color: var(--bs-body-color);
            border-color: var(--bs-body-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #333333;
            border-color: #333333;
            color: #ffffff;
        }

        .btn-success {
            background-color: var(--positive-color);
            border-color: var(--positive-color);
            color: #ffffff;
        }

        .btn-success:hover {
            background-color: #00a846;
            border-color: #00a846;
        }

        .btn-danger {
            background-color: var(--negative-color);
            border-color: var(--negative-color);
        }

        .btn-outline-success {
            color: var(--positive-color);
            border-color: var(--positive-color);
        }

        .btn-outline-success:hover {
            background-color: var(--positive-color);
            color: #ffffff;
        }

        .btn-outline-danger {
            color: var(--negative-color);
            border-color: var(--negative-color);
        }

        .btn-outline-danger:hover {
            background-color: var(--negative-color);
            color: #ffffff;
        }

        .btn-outline-secondary {
            color: var(--neutral-color);
            border-color: var(--neutral-color);
        }

        .btn-outline-info {
            color: var(--bs-body-color);
            border-color: var(--card-border);
        }

        .btn-outline-info:hover {
            background-color: var(--card-border);
            color: var(--bs-body-color);
        }

        .form-control, .form-select {
            background-color: #ffffff;
            border-color: var(--card-border);
            color: var(--bs-body-color);
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: var(--bs-body-color);
            color: var(--bs-body-color);
            box-shadow: 0 0 0 0.25rem rgba(0, 0, 0, 0.1);
        }

        .form-control::placeholder {
            color: var(--muted-color);
        }

        .form-label {
            color: var(--neutral-color);
            font-size: 0.875rem;
        }

        .table {
            color: var(--bs-body-color);
        }

        .table-dark {
            --bs-table-bg: var(--card-bg);
            --bs-table-border-color: var(--card-border);
            --bs-table-color: var(--bs-body-color);
        }

        .table-dark th {
            color: var(--neutral-color);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .table-dark td {
            color: var(--bs-body-color);
        }

        .badge-connected { background-color: var(--positive-color) !important; color: #fff !important; }
        .badge-disconnected { background-color: var(--muted-color) !important; }
        .badge-error { background-color: var(--negative-color) !important; }

        .badge.bg-info { background-color: var(--neutral-color) !important; }
        .badge.bg-primary { background-color: var(--bs-body-color) !important; color: #fff !important; }
        .badge.bg-warning { background-color: #ff9800 !important; color: #000 !important; }
        .badge.bg-success { background-color: var(--positive-color) !important; color: #fff !important; }
        .badge.bg-danger { background-color: var(--negative-color) !important; }
        .badge.bg-secondary { background-color: var(--neutral-color) !important; }

        .zscore-display {
            font-size: 3rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .price-display {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
        }

        .algo-toggle {
            font-size: 1.5rem;
        }

        #status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-running { background-color: var(--positive-color); animation: pulse 2s infinite; }
        .status-stopped { background-color: var(--muted-color); }
        .status-error { background-color: var(--negative-color); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chart-container {
            height: 300px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .text-muted {
            color: var(--neutral-color) !important;
        }

        .text-white {
            color: var(--bs-body-color) !important;
        }

        code {
            color: var(--positive-color);
            background-color: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
        }

        hr {
            border-color: var(--card-border);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bs-body-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--neutral-color);
        }

        /* Custom profit/loss styling */
        .profit { color: var(--positive-color) !important; }
        .loss { color: var(--negative-color) !important; }

        /* Trade direction badges */
        .badge-buy { background-color: var(--positive-color) !important; color: #fff !important; }
        .badge-sell { background-color: var(--negative-color) !important; color: #fff !important; }

        /* Dark card override for specific elements */
        .card.bg-dark, .card.bg-secondary {
            background-color: #e9ecef !important;
            color: var(--bs-body-color);
        }

        .bg-dark {
            background-color: #e9ecef !important;
            color: var(--bs-body-color) !important;
        }

        .bg-secondary {
            background-color: #f1f3f5 !important;
        }

        /* Modal styling */
        .modal-content.bg-dark {
            background-color: #ffffff !important;
            color: var(--bs-body-color);
        }

        .btn-close-white {
            filter: none;
        }

        /* Navbar text */
        #status-text {
            color: #ffffff;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up-arrow me-2"></i>Multi-Broker Arb
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="/settings">
                            <i class="bi bi-gear me-1"></i>Settings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'setup' %}active{% endif %}" href="/setup">
                            <i class="bi bi-hdd-network me-1"></i>Setup
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'analysis' %}active{% endif %}" href="/analysis">
                            <i class="bi bi-bar-chart me-1"></i>SD Analysis
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="status-indicator" class="status-stopped"></span>
                    <span id="status-text" class="me-3">Stopped</span>
                    <button id="engine-toggle" class="btn btn-outline-success btn-sm me-2">
                        <i class="bi bi-play-fill"></i> Start
                    </button>
                    <button id="shutdown-btn" class="btn btn-outline-secondary btn-sm" title="Shutdown Application">
                        <i class="bi bi-power"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
        // Socket.IO connection
        const socket = io();

        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('request_status');
        });

        socket.on('status', (data) => {
            updateStatus(data.state);
        });

        socket.on('tick', (data) => {
            updateTickData(data);
        });

        socket.on('signal', (data) => {
            updateSignal(data);
        });

        socket.on('trade', (data) => {
            handleTrade(data);
        });

        // Status indicator
        function updateStatus(state) {
            const indicator = document.getElementById('status-indicator');
            const text = document.getElementById('status-text');
            const btn = document.getElementById('engine-toggle');

            indicator.className = '';
            if (state === 'RUNNING') {
                indicator.classList.add('status-running');
                text.textContent = 'Running';
                btn.innerHTML = '<i class="bi bi-stop-fill"></i> Stop';
                btn.classList.remove('btn-outline-success');
                btn.classList.add('btn-outline-danger');
            } else if (state === 'ERROR') {
                indicator.classList.add('status-error');
                text.textContent = 'Error';
            } else {
                indicator.classList.add('status-stopped');
                text.textContent = 'Stopped';
                btn.innerHTML = '<i class="bi bi-play-fill"></i> Start';
                btn.classList.remove('btn-outline-danger');
                btn.classList.add('btn-outline-success');
            }
        }

        // Engine toggle
        document.getElementById('engine-toggle').addEventListener('click', async () => {
            const btn = document.getElementById('engine-toggle');
            const isRunning = btn.classList.contains('btn-outline-danger');

            const endpoint = isRunning ? '/api/engine/stop' : '/api/engine/start';
            const response = await fetch(endpoint, { method: 'POST' });
            const result = await response.json();

            if (!result.success) {
                alert('Error: ' + result.error);
            }
        });

        // Shutdown button
        document.getElementById('shutdown-btn').addEventListener('click', async () => {
            if (confirm('Are you sure you want to shutdown StatArb Pro?')) {
                try {
                    await fetch('/api/shutdown', { method: 'POST' });
                    document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;"><h2>StatArb Pro has been shut down</h2><p>You can close this browser tab.</p></div>';
                } catch (e) {
                    // Server shutdown, connection lost - this is expected
                    document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;"><h2>StatArb Pro has been shut down</h2><p>You can close this browser tab.</p></div>';
                }
            }
        });

        // Override these in specific pages
        function updateTickData(data) {}
        function updateSignal(data) {}
        function handleTrade(data) {}
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
