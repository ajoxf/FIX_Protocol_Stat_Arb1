# Multi-Broker Arbitrage System Configuration
# Broker connection settings for MT5, FIX, FlexTrade, and IB backends

# Default asset configuration
asset:
  name: "GOLD"
  spot_symbol: "XAUUSD"
  futures_symbol: "GC0226"
  contract_size: 100
  swap_charge: 0

# Broker configurations
brokers:
  # Spot Broker (example MT5)
  - broker_id: "spot_broker"
    name: "IC Markets - Spot"
    type: "MT5"
    role: "SPOT"
    symbol: "XAUUSD"

    # MT5 connection settings
    mt5_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
    mt5_account: 12345678
    mt5_server: "ICMarkets-Demo"
    mt5_password: ""  # Set via environment variable MT5_SPOT_PASSWORD

    # Trading settings
    contract_size: 100
    commission_per_lot: 7.0
    min_volume: 0.01

  # Futures Broker (example MT5)
  - broker_id: "futures_broker"
    name: "AMP Futures"
    type: "MT5"
    role: "FUTURES"
    symbol: "GC0226"

    # MT5 connection settings
    mt5_path: "C:\\Program Files\\MetaTrader 5 AMP\\terminal64.exe"
    mt5_account: 87654321
    mt5_server: "AMPGlobalClearing-Demo"
    mt5_password: ""  # Set via environment variable MT5_FUTURES_PASSWORD

    # Trading settings
    contract_size: 100
    commission_per_lot: 4.0
    min_volume: 0.01

