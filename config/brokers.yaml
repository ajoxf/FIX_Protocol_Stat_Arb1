# IPC settings
ipc:
  # Redis connection (preferred for multi-process)
  redis:
    host: "localhost"
    port: 6379
    db: 0

  # Fallback to in-memory if Redis unavailable
  fallback_to_memory: true

# Logging settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/trading.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
